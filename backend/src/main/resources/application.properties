spring.application.name=manote

# Rahasia (secret JWT, password database) dibaca dari file .env di folder backend,
# atau dari environment variable saat deploy. Lihat .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${MANOTE_DB_URL:jdbc:postgresql://localhost:1035/manote}
spring.datasource.username=${MANOTE_DB_USERNAME:manote}
spring.datasource.password=${MANOTE_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Backend berjalan di belakang proxy/tunnel HTTPS.
server.forward-headers-strategy=native

# Wajib diisi, minimal 32 karakter. Tidak ada nilai default supaya tidak pernah jalan dengan secret yang diketahui umum.
manote.jwt.secret=${MANOTE_JWT_SECRET}
manote.jwt.expiration=24h
manote.cors.allowed-origins=${MANOTE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Setelah sekian kali login gagal berturut-turut, akun dikunci sementara.
manote.login.max-failures=5
manote.login.lock-duration=5m

# Catatan setiap permintaan (waktu, alamat pengirim, tujuan, status) di backend/logs/.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${user.dir}/logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.pattern=%{yyyy-MM-dd HH:mm:ss}t %a "%r" %s "%{User-Agent}i"
